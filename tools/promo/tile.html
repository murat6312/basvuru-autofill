<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Chrome Web Store kucuk tanitim gorseli: tam 440x280 */
      html, body { margin: 0; padding: 0; width: 440px; height: 280px; overflow: hidden; }
      body {
        display: flex; align-items: center; gap: 22px;
        padding: 0 30px; box-sizing: border-box;
        background: linear-gradient(135deg, #15803d 0%, #16a34a 55%, #22c55e 100%);
        color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .mark {
        flex: 0 0 96px; height: 96px; border-radius: 22px; background: #fff;
        display: flex; align-items: center; justify-content: center;
      }
      .mark svg { width: 58px; height: 58px; }
      h1 { font-size: 29px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -.3px; }
      p { font-size: 15.5px; line-height: 1.35; margin: 0; opacity: .95; }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5 L9.5 18 L20 6" />
      </svg>
    </div>
    <div>
      <h1>Başvuru Autofill</h1>
      <p>Formları tek tuşla doldurur.<br />Türkçe alanları tanır, veriler cihazınızda kalır.</p>
    </div>
  </body>
</html>
